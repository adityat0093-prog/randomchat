name: Build APK

on:
  push:
    branches: ['**']        # every branch, including feature/*
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true  # a newer push to the same branch cancels the older run

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain "-PserverUrl=${{ vars.SERVER_URL }}" 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        working-directory: android
        run: |
          grep -E "^e: |error:" build.log | head -60 || true

      - uses: actions/upload-artifact@v4
        with:
          name: randomchat-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk